# Ehsan Personal AI Control Plane — foundation preset
# Secrets are intentionally NOT stored here.
# Set NARAROUTER_API_KEY in the environment when cloud acceleration is wanted.

[engine]
default = "ollama"

[engine.ollama]
host = "http://localhost:11434"

[engine.nararouter]
host = "https://router.bynara.id"
free_only = true

[intelligence]
default_model = ""
model_code = "free/code"

[agent]
default_agent = "orchestrator"
max_turns = 16
context_from_memory = true

[tools]
enabled = [
  "file_read",
  "file_write",
  "apply_patch",
  "shell_exec",
  "git_status",
  "git_diff",
  "code_interpreter",
  "web_search",
  "think",
  "calculator",
  "project_registry",
  "drive_inventory",
  "machine_inventory",
  "voicebox_status",
  "voicebox.speak",
  "voicebox.transcribe",
  "voicebox.list_captures",
  "voicebox.list_profiles",
  "voicebox_speak",
  "voicebox_transcribe",
  "voicebox_list_captures",
  "voicebox_list_profiles",
  "hygiene_report",
]

[tools.storage]
default_backend = "sqlite"

[projects]
root = "D:\\Projects"
registry_path = "D:\\AI-Control\\registry\\projects.json"
inventory_root = "D:\\"
inventory_path = "D:\\AI-Control\\registry\\drive-inventory.json"
machine_inventory_path = "D:\\AI-Control\\registry\\machine-inventory.json"
cleanup_report_path = "D:\\AI-Control\\registry\\cleanup-report.json"
duplicate_report_path = "D:\\AI-Control\\registry\\duplicate-report.json"
max_depth = 5
inventory_max_files = 2000000
duplicate_min_size_mb = 1
cleanup_min_age_days = 30
voicebox_host = "http://127.0.0.1:17493"

[traces]
enabled = true

[learning]
# Automatic self-modification stays disabled. Traces and evaluations can still
# feed benchmarked routing and skill improvements.
enabled = false

[speech]
backend = "auto"
model = "base"
language = ""
device = "auto"
compute_type = "int8"

[tools.mcp]
enabled = true
servers = '[{"name":"voicebox","url":"http://127.0.0.1:17493/mcp/","headers":{"X-Voicebox-Client-Id":"openjarvis"}}]'

[security]
profile = "personal"

[analytics]
enabled = false

[server]
host = "127.0.0.1"
port = 8000
agent = "orchestrator"
